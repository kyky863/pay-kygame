<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay KyGame 3D Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div id="topbar">
      <div>
        <h1>Pay KyGame 3D Prototype</h1>
        <p id="statusText">Loading terrain...</p>
      </div>
      <div id="controls">
        <button id="regenButton">Regenerate World</button>
        <button id="pauseButton">Pause</button>
      </div>
    </div>

    <div id="tileInfo">
      <strong>Hover a hex tile to inspect it.</strong>
      <div id="tileDetails"></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
  <script src="main.js"></script>
</body>
</html>
