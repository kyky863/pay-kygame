<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay KyGame 3D Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ui">
    <div id="topbar">
      <div>
        <h1>Pay KyGame 3D Prototype</h1>
        <p id="statusText">Loading terrain...</p>
      </div>
      <div id="controls">
        <button id="regenButton">Regenerate World</button>
        <button id="pauseButton">Pause</button>
      </div>
    </div>

    <div id="tileInfo">
      <strong>Hover a hex tile to inspect it.</strong>
      <div id="tileDetails"></div>
    </div>

    <div id="timeControl">
      <label for="timeSpeedSlider">Time Speed:</label>
      <input type="range" id="timeSpeedSlider" min="0.5" max="16" step="0.5" value="1">
      <span id="timeSpeedValue">1.0x</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
